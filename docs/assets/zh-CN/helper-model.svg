<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" fill="none">
  <rect width="720" height="280" rx="12" fill="#f8fafc"/>
  <rect x="1" y="1" width="718" height="278" rx="11" stroke="#e2e8f0"/>
  <text x="360" y="28" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#0f172a">dsh-helper：N 个实例 = N 套独立的 dsh</text>
  <rect x="16" y="44" width="688" height="188" rx="10" fill="#fff" stroke="#93c5fd"/>
  <text x="32" y="68" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">同一桌面窗口（可无限新建）</text>

  <rect x="32" y="84" width="200" height="128" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="132" y="108" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#1e40af">实例 A = 一套 dsh</text>
  <text x="132" y="130" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#1d4ed8">客服接待</text>
  <text x="132" y="152" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" fill="#64748b">独立进程 · 独立端口</text>
  <text x="132" y="172" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" fill="#64748b">独立 DSH_HOME</text>
  <text x="132" y="194" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">只装客服相关插件</text>

  <rect x="260" y="84" width="200" height="128" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="360" y="108" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#c2410c">实例 B = 一套 dsh</text>
  <text x="360" y="130" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#ea580c">写代码</text>
  <text x="360" y="152" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" fill="#64748b">独立进程 · 独立端口</text>
  <text x="360" y="172" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" fill="#64748b">独立 DSH_HOME</text>
  <text x="360" y="194" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">只装编码相关插件</text>

  <rect x="488" y="84" width="200" height="128" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="588" y="108" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#047857">实例 C = 一套 dsh</text>
  <text x="588" y="130" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#059669">跑测试</text>
  <text x="588" y="152" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" fill="#64748b">独立进程 · 独立端口</text>
  <text x="588" y="172" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" fill="#64748b">独立 DSH_HOME</text>
  <text x="588" y="194" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" fill="#94a3b8">只装测试相关插件</text>

  <text x="360" y="260" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" fill="#1d4ed8">三套 dsh 并行 · 互不冲突 · 需要几个就新建几个</text>
</svg>